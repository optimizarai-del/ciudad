# ─── CIUDAD Ventas — nginx del frontend (deploy compose "app nueva") ─────────
# Sirve la SPA y hace reverse-proxy del API al servicio `backend` del compose.
# Resultado: el navegador habla siempre con el MISMO origen → sin CORS y sin
# VITE_API_URL. FastAPI, detrás del proxy, resuelve sus propios redirects de
# trailing-slash (evita el problema del catch-all del SPA en single-container).

upstream backend {
    server backend:8000;
}

# Esquema ORIGINAL del cliente. Detrás del proxy de Easypanel (Traefik termina
# TLS y reenvía a este nginx por http), $scheme sería "http" y uvicorn armaría
# los redirects de trailing-slash con Location http:// → Mixed Content en la
# SPA https. Preservamos el X-Forwarded-Proto que ya mandó Traefik (https);
# si no viene (acceso directo), caemos a $scheme.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;   # subida de PDFs/planos para la carga por IA

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── API + auth + docs → backend ──
    location /api/    { proxy_pass http://backend; include /etc/nginx/conf.d/_proxy.inc; }
    location /auth/   { proxy_pass http://backend; include /etc/nginx/conf.d/_proxy.inc; }
    location = /health { proxy_pass http://backend; include /etc/nginx/conf.d/_proxy.inc; }
    location /docs    { proxy_pass http://backend; include /etc/nginx/conf.d/_proxy.inc; }
    location /redoc   { proxy_pass http://backend; include /etc/nginx/conf.d/_proxy.inc; }
    location = /openapi.json { proxy_pass http://backend; include /etc/nginx/conf.d/_proxy.inc; }

    # ── Assets con hash → cache largo ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── index sin cache (para ver deploys nuevos) ──
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ═══════════════════════════════════════════════════════════════════════════
#  CIUDAD Ventas — stack para app nueva (Easypanel "Compose" o server propio)
#
#  Dos servicios:
#    backend   FastAPI (uvicorn) en :8000, interno — lo alcanza el frontend.
#    frontend  React/Vite en nginx :80, reverse-proxy /api /auth /health → backend.
#
#  El navegador habla SIEMPRE con el mismo origen (el frontend) → sin CORS y sin
#  configurar VITE_API_URL. nginx reenvía el API al backend por red interna.
#
#  ── Easypanel (Compose) ──
#    Origen: repo optimizarai-del/ciudad, rama ventas-ciudad, archivo docker-compose.yml.
#    Variables: seteá al menos SECRET_KEY en la pestaña Environment.
#    Dominio: agregá un dominio al servicio `frontend`, puerto 80.
#
#  ── Server propio (docker compose) ──
#    cp backend/.env.example .env   # opcional; o exportá las variables
#    Descomentá el bloque `ports:` del frontend y:  docker compose up -d --build
#
#  El scraping en background (Redis + worker RQ) es opcional: ver
#  docker-compose.scraping.yml. Sin eso, el scraping corre síncrono en el request.
# ═══════════════════════════════════════════════════════════════════════════

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # nginx sirve el frontend → el backend NO monta el SPA (evita que el
      # catch-all rompa los redirects de trailing-slash del API).
      SERVE_FRONTEND: "false"
      # Núcleo. Seteá SECRET_KEY en el entorno del deploy (Easypanel/`.env`).
      SECRET_KEY: ${SECRET_KEY:-CAMBIAME_secreto_ventas_ciudad}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/ciudad.db}
      CIUDAD_DB_SCHEMA: ${CIUDAD_DB_SCHEMA:-ciudad}
      # Opcionales — activan integraciones. Vacío = feature apagada.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      ANTHROPIC_MODEL_IMPORT: ${ANTHROPIC_MODEL_IMPORT:-claude-sonnet-4-5}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      VENTAS_TELEGRAM_BOT_TOKEN: ${VENTAS_TELEGRAM_BOT_TOKEN:-}
      TOKKO_API_KEY: ${TOKKO_API_KEY:-}
      TOKKO_USER: ${TOKKO_USER:-}
      TOKKO_PASS: ${TOKKO_PASS:-}
      VENTAS_JOB_TOKEN: ${VENTAS_JOB_TOKEN:-}
      INSTAGRAM_VERIFY_TOKEN: ${INSTAGRAM_VERIFY_TOKEN:-ciudad_verify_token}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-ciudad_whatsapp_token}
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      # Persistencia de SQLite + adjuntos. Con Postgres/Supabase igual guarda
      # los archivos subidos.
      - ciudad_data:/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""        # vacío = mismo origen (nginx proxya /api → backend)
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/_proxy.inc:/etc/nginx/conf.d/_proxy.inc:ro
    expose:
      - "80"
    # ── Server propio (bare VPS): descomentá para publicar el puerto. En
    #    Easypanel NO uses esto (el dominio del servicio `frontend` ya enruta al 80).
    # ports:
    #   - "${PUBLIC_PORT:-80}:80"

volumes:
  ciudad_data:
